{% extends "base.html" %}

{% block title %} Dashboard - GameMaster {% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tile.css') }}">
{% endblock %}

{% block content %}

{% for title, events in sections %}
<section class="profile-section row event-row">
  <h2>{{ title }}</h2>
  <div class="event-carousel">
    <div class="carousel">
      {% for event in events %}
      {% include "components/event_tile.html" %}
      {% endfor %}
    </div>
  </div>
</section>
{% endfor %}


{% endblock %}
