{% block topbar %}
<div id="topbar" class="pure-g">
  <div class="pure-u-1 pure-u-md-1-3">
    <div class="pure-menu" style="width: fit-content;">
      <a href="{{ url_for('index') }}" class="pure-menu-link">Game Master</a>
    </div>
  </div>
  <div class="pure-u-1 pure-u-md-1-3">
    <div class="pure-menu pure-menu-horizontal">
      <form id="search-form" role="search" method="GET" aria-label="Site search"
        class="pure-form pure-g">
        <div id="search-container" class="pure-g">
          <input type="search" id="search" name="q" value="{{request.args.get('q','')}}" autocomplete="off"
            placeholder="Search..." aria-label="Search" />
          <button type="button" class="fa fa-search" aria-label="Submit search" onclick="handleSearch()"></button>
        </div>
        <!-- <div id="search-results-container">
          <ul id="search-results"></ul>
        </div> -->
      </form>
    </div>
  </div>
  <div class="pure-u-1 pure-u-md-1-3">
    <div class="pure-menu pure-menu-horizontal menu-3">
      <ul class="pure-menu-list">
        {% if session.get('profile') %}


        <li class="pure-menu-item pure-menu-has-children">

          <a id="menuLink1" class="pure-menu-link">
            <img class="user-ico pure-img" src="{{ session['profile']['profile_pic'] or url_for('static', filename='images/avatar-default.svg') }}" width="32" height="32">
          </a>
          <ul class="accountDetails pure-menu-children">
            <li class="pure-menu-item">
              {% if session.get('profile').get('setup_complete') %}
              <a class="pure-menu-link" href="{{ url_for('user', username=session['profile']['username']) }}">My
                Profile</a>
              {% else %}
              <a class="pure-menu-link" href="{{ url_for('username') }}">Set Username</a>
              {% endif %}
            </li>
            <li class="pure-menu-item">
              <a class="pure-menu-link" href="{{ url_for('account') }}">Account</a>
            </li>
            <li class="pure-menu-item">
              <form method="post" action="{{ url_for('logout') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="pure-button" type="submit">Log Out</button>
              </form>
            </li>
          </ul>
        </li>
        {% else %}
        <li class="pure-menu-item">
          <a class="pure-menu-link" href="{{ url_for('login') }}">Login</a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='javascript/topbar.js') }}"></script>
<script src="{{ url_for('static', filename='javascript/menu.js') }}"></script>
{% endblock %}
