<div class="tile user-tile">
  <h3>{{ user.display_name }}</h3>
  <img class="user-ico" src="{{ user.profile_pic }}" width="128" height="128">

  <div class="footer">
    <form action="{{ url_for('user', user_id=user.id) }}">
      <button class="pure-button" type="submit">View Profile</button>
    </form>
  </div>
</div>
