{% macro search-autocomplete(searchid) %}
<form method="POST" autocomplete="off">
  <div class='bgg-search'>
    <div class='bgg-searchbar'>
      <input id={{ searchid }} role="search" class='bgg-input' type='text' name='bgg_game' placeholder='Game...' />
      <input type="hidden" name="game-name" value="">
      <input type="hidden" name="game-id" value="">
    </div>

  </div>
</form>
{% endmacro %}
