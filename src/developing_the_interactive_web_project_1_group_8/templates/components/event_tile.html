<div class="event-tile profile-section">
  <div class="event-header-container">
    <div class="event-header-game-info">
      <!-- <div class="event-game-image"></div> -->
      {% if event.image_url %}
      <img class="event-game-image" src="{{ event.image_url }}">
      {% else %}
      <div class="event-game-image event-image-placeholder">No image</div>
      {% endif %}

    </div>
    <div class="event-info-header">
      <h3 class="event-name" title="{{ event.name }}">{{event.name}}</h3>
      <div class="event-game-name">
        {% include "components/bgg_game_link.html" %}
      </div>
      <div class="event-date-time">{{event.time | format_tile_time}}</div>
      <div class="event-location" title="{{ event.address }}">{{event.address}}</div>
    </div>
    <div class="event-attendance">
      {% include "components/event_status.html" %}
      <div>{{ event.count }}/{{event.max_attendees}} Going</div>
    </div>
  </div>
  <div class="event-buttons-container settings-actions">
    <a href="{{ url_for('rsvp', event_id=event.id) }}" class="event-button pure-button pure-button-primary">RSVP</a>
    <a href="{{ url_for('event', event_id=event.id) }}" class="event-button pure-button">Details</a>
  </div>
</div>
