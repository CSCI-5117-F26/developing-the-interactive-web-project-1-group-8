{% extends "base.html" %}
{% block title %}Profile settings{% endblock %}
{% block content %}
<section class="profile-content">
  <h1>Profile settings</h1>
  <p><a href="{{ url_for('user', user_id=user.id) }}">View my public profile</a></p>

  {% if errors %}
  <div>
    <p>Please correct these fields:</p>
    <ul>
      {% for error in errors %}
      <li>{{ error }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <form class="pure-form pure-form-stacked" method="post" action="{{ url_for('settings') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="display_name">Display name</label>
    <input class="pure-input" id="display_name" name="display_name" type="text" value="{{ values.display_name }}" maxlength="80" required>

    <label for="bio">Biography</label>
    <textarea class="pure-input" id="bio" name="bio" rows="6" maxlength="4000"">{{ values.bio }}</textarea>
    <p id="bio-help">Up to 4000 characters</p>

    <button class="pure-button pure-button-primary" type="submit">Save profile</button>
  </form>


</section>
{% endblock %}
