{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<section class="page-panel">
<h1>Signed in</h1>
<p>Hello {{ user.display_name }}.</p>
<p>Local user ID is {{ user.id }}.</p>
<p>Auth0 user ID is {{ user.auth0_sub }}.</p>
<p><a href="{{ url_for('user', username=user.display_name) }}">View my profile</a></p>
<p><a href="{{ url_for('settings') }}">Edit my profile</a></p>
</section>
{% endblock %}
