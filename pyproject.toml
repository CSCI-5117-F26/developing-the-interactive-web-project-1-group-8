[project]
name = "developing-the-interactive-web-project-1-group-8"
version = "1.0.0"
description = "CSCI 5117 Project 1: a social game scheduling website."
readme = "README.md"
authors = [
    { name = "Nick Hinds", email = "hinds084@umn.edu" },
    { name = "Russell Shaver", email = "shave083@umn.edu" },
    { name = "Marko Krstulovic", email = "krstu002@umn.edu" },
    { name = "Pranshu Panda", email = "pand068@umn.edu" },
    { name = "Tayler Miller", email = "mil00154@umn.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "faker>=18.0.0",
    "psycopg>=3.0.0",
    "authlib>=1.8.0",
    "requests>=2.34.2",
]

[project.scripts]
developing-the-interactive-web-project-1-group-8 = "developing_the_interactive_web_project_1_group_8:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
